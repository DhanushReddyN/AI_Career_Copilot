services:

  # ── FastAPI Backend ──────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_career_copilot_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist ChromaDB vector stores across restarts
      - chroma_data:/app/chroma_resume
      - chroma_jd_data:/app/chroma_jd
      # Persist uploaded documents
      - upload_data:/app/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ── Streamlit Frontend ───────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai_career_copilot_frontend
    ports:
      - "8501:8501"
    environment:
      # Points frontend at the backend container
      - FASTAPI_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# ── Named Volumes ────────────────────────────────────
volumes:
  chroma_data:
  chroma_jd_data:
  upload_data: